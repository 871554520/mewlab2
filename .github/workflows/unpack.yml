name: 解包 Mewgenics 资源

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 下载分片并拼接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download gpak --pattern 'part_*.bin' --dir parts --clobber
          echo "分片数: $(ls parts | wc -l)"
          cat parts/part_*.bin > arc.rar
          rm -rf parts
          ls -l arc.rar
          shasum -a 256 arc.rar

      - name: 解出 gpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar
          mkdir -p out
          unrar x -o+ -idq arc.rar out/ || true
          ls -l out/Mewgenics/ || true
          rm -f arc.rar

      - name: 按偏移取文件
        run: |
          python3 tools/dump_gpak.py out/Mewgenics/resources.gpak pack/index.json assets
          rm -f out/Mewgenics/resources.gpak
          du -sh assets/* | sort -h

      - name: 打包分卷
        run: |
          cd assets
          tar -czf ../data_levels_textures.tgz data levels textures shaders
          tar -cf ../swfs.tar swfs
          cd ..
          rm -rf assets out
          split -b 900M data_levels_textures.tgz dl_
          split -b 900M swfs.tar swf_
          ls -lh dl_* swf_*
          df -h .

      - uses: actions/upload-artifact@v4
        with:
          name: mew-assets
          path: |
            dl_*
            swf_*
          if-no-files-found: error
          retention-days: 7
