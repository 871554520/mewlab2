name: 解包 Mewgenics 资源

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 用 API + curl 逐个下载分片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          mkdir -p parts
          REL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN"             https://api.github.com/repos/${{ github.repository }}/releases/tags/gpak)
          echo "$REL" | head -c 300 || true
          IDS=$(echo "$REL" | python3 -c "import sys,json;d=json.load(sys.stdin);print(' '.join(a['id'] for a in d.get('assets',[])))") || true
          echo "asset ids: $(echo $IDS | wc -w)" | tee -a $GITHUB_STEP_SUMMARY
          for id in $IDS; do
            curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream"               -o "parts/part_$id.bin"               https://api.github.com/repos/${{ github.repository }}/releases/assets/$id
          done
          ls parts | wc -l | tee -a $GITHUB_STEP_SUMMARY
          cat $(ls parts/*.bin | sort) > arc.rar
          SIZE=$(stat -c %s arc.rar)
          echo "arc.rar=$SIZE 期望=4071175274" | tee -a $GITHUB_STEP_SUMMARY
          test "$SIZE" = "4071175274"

      - name: 解包
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar zlib1g-dev g++ >/dev/null
          mkdir -p out
          unrar x -o+ out/ arc.rar > unrar.log 2>&1 || true
          tail -5 unrar.log | tee -a $GITHUB_STEP_SUMMARY
          ls -l out/Mewgenics/resources.gpak | tee -a $GITHUB_STEP_SUMMARY || (echo "gpak 缺失" | tee -a $GITHUB_STEP_SUMMARY; exit 1)

      - name: 编译导出器
        run: |
          g++ -std=c++17 -O2 -Itools tools/swf.cpp tools/softrender.cpp tools/export_main.cpp -lz -o /tmp/export 2>&1 | tee compile.log
          echo "编译完成" | tee -a $GITHUB_STEP_SUMMARY

      - name: 导出角色
        run: |
          python3 tools/export_swfs.py out/Mewgenics/resources.gpak pack/index.json /tmp/export arts 2>&1 | tee export.log || true
          echo "png=$(find arts -name '*.png' 2>/dev/null | wc -l)" | tee -a $GITHUB_STEP_SUMMARY

      - name: 打包
        if: always()
        run: |
          tar -czf arts.tgz arts compile.log export.log unrar.log 2>/dev/null || tar -czf arts.tgz compile.log 2>/dev/null || echo none > arts.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arts
          path: arts.tgz
          if-no-files-found: warn
