name: 解包 Mewgenics 资源

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 分片拼接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download gpak --pattern 'part_*.bin' --dir parts --clobber
          cat parts/part_*.bin > arc.rar
          rm -rf parts
      - name: 解包并导出角色
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar zlib1g-dev g++ >/dev/null
          mkdir -p out
          unrar x -o+ -idq arc.rar out/ || true
          rm -f arc.rar
          g++ -std=c++17 -O2 -Itools tools/swf.cpp tools/softrender.cpp tools/export_main.cpp -lz -o /tmp/export
          python3 tools/export_swfs.py out/Mewgenics/resources.gpak pack/index.json /tmp/export arts
          find arts -name '*.png' | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arts
          path: arts
          if-no-files-found: warn
