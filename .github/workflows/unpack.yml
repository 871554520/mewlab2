name: 解包 Mewgenics 资源

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 下载分片并拼接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p parts
          gh release download gpak --pattern 'part_*.bin' --dir parts --clobber
          echo "分片数: $(ls parts | wc -l)"
          cat parts/part_*.bin > arc.rar
          rm -rf parts
          shasum -a 256 arc.rar

      - name: 解出 gpak
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unrar
          mkdir -p out
          unrar x -o+ -idq arc.rar out/ || true
          ls -l out/Mewgenics/ || true
          rm -f arc.rar

      - name: 按偏移取文件
        run: |
          python3 tools/dump_gpak.py out/Mewgenics/resources.gpak pack/index.json assets
          rm -f out/Mewgenics/resources.gpak
          du -sh assets/* | sort -h
          find assets -type f | wc -l

      - name: 打小包（数据/关卡/贴图/着色器）
        run: |
          cd assets
          tar -czf ../mew-small.tgz data levels textures shaders
          cd ..
          ls -lh mew-small.tgz

      - name: 打大包（SWF，另行下载）
        run: |
          cd assets
          tar -cf ../swfs.tar swfs
          cd ..
          split -b 900M swfs.tar swf_
          ls -lh swf_* 2>/dev/null | head

      - uses: actions/upload-artifact@v4
        with:
          name: mew-small
          path: mew-small.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mew-swfs
          path: |
            swf_*
          if-no-files-found: warn
